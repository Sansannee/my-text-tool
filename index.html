<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กิ๊วววววววววว</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #6c5ce7;
            --success-color: #28a745;
            --danger-color: #f17769;
            --bg-color: #fdfeff;
        }

        body {
            font-family: 'Inter', -apple-system, 'Sarabun', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 95%;
            max-width: 650px;
        }

        h2 { color: #333; margin-top: 0; text-align: center; font-size: 24px; letter-spacing: 1px; }

        textarea {
            width: 100%;
            height: 220px;
            padding: 15px;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
            line-height: 1.6;
            background: #fdfdfd;
        }

        textarea:focus { 
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.2);
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 15px;
        }

        button:active { transform: scale(0.97); }

        .btn-upper { background-color: var(--primary-color); color: white; }
        .btn-lower { background-color: var(--secondary-color); color: white; }
        .btn-copy { background-color: var(--success-color); color: white; }
        .btn-clear { background-color: #adb5bd; color: white; }

        button:hover { filter: brightness(1.1); }

        #statusMsg {
            text-align: center;
            height: 20px;
            margin: 10px 0;
            font-size: 14px;
            color: var(--primary-color);
            font-weight: 500;
        }

        .footer-note {
            font-size: 12px;
            color: #f17979;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📝แปลงตัวอังษรจ้า</h2>
    
    <textarea id="inputText" placeholder="วางข้อความภาษาอังกฤษไว้หม่องนี้จ้า.... "></textarea>
    
    <div id="statusMsg"></div>

    <div class="button-grid">
        <button class="btn-lower" onclick="transformText('lower')">⬇️ แปลงเป็นตัวพิมพ์เล็ก</button>
        <button class="btn-upper" onclick="transformText('upper')">⬆️ แปลงเป็นตัวพิมพ์ใหญ่</button>
        <button class="btn-clear" onclick="clearAll()">🧹 ล้างหน้าจอ</button>
        <button class="btn-copy" onclick="copyText()">📋 คัดลอกข้อความ</button>
    </div>

    <div class="footer-note">* ทุกการแปลงจะลบบรรทัดที่ว่างเปล่าออกให้อัตโนมัติ</div>
</div>

<script>
    const textArea = document.getElementById("inputText");
    const statusMsg = document.getElementById("statusMsg");

    // ฟังก์ชันหลักในการจัดการข้อความ
    function transformText(mode) {
        let text = textArea.value;
        if (!text.trim()) {
            showStatus("กรุณาใส่ข้อความก่อนจ้า", true);
            return;
        }

        // 1. แยกบรรทัด ลบช่องว่างหัวท้าย และกรองบรรทัดว่างออก
        let lines = text.split('\n')
                        .map(line => line.trim())
                        .filter(line => line !== "");

        // 2. รวมกลับ และแปลง Case
        let result = lines.join('\n');
        
        if (mode === 'upper') {
            result = result.toUpperCase();
            showStatus("แปลงเป็นตัวพิมพ์ใหญ่ & ลบบรรทัดว่างแล้ว!");
        } else {
            result = result.toLowerCase();
            showStatus("แปลงเป็นตัวพิมพ์เล็ก & ลบบรรทัดว่างแล้ว!");
        }

        textArea.value = result;
    }

    // ฟังก์ชันคัดลอก
    async function copyText() {
        if (!textArea.value) {
            showStatus("ไม่มีข้อความให้คัดลอก", true);
            return;
        }
        try {
            await navigator.clipboard.writeText(textArea.value);
            showStatus("คัดลอกลง Clipboard เรียบร้อย! ✅");
        } catch (err) {
            // fallback สำหรับเบราว์เซอร์เก่า
            textArea.select();
            document.execCommand("copy");
            showStatus("คัดลอกเรียบร้อย! ✅");
        }
    }

    // ฟังก์ชันล้างหน้าจอ
    function clearAll() {
        textArea.value = "";
        showStatus("ล้างข้อมูลแล้ว");
    }

    function showStatus(msg, isError = false) {
        statusMsg.style.color = isError ? "#e74c3c" : "#4a90e2";
        statusMsg.innerText = msg;
        setTimeout(() => { statusMsg.innerText = ""; }, 3000);
    }
</script>

</body>
</html>
